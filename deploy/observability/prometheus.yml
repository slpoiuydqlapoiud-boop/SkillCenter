global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/skill-center-alerts.yml

scrape_configs:
  - job_name: skill-center-api
    metrics_path: /internal/metrics
    bearer_token_file: /etc/prometheus/secrets/skill-center-metrics-token
    static_configs:
      - targets:
          - skill-center-api:8080
