name: skillcenter-local

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${SKILL_CENTER_POSTGRES_DB:-skillcenter}
      POSTGRES_USER: ${SKILL_CENTER_POSTGRES_USERNAME:-skillcenter}
      POSTGRES_PASSWORD: ${SKILL_CENTER_POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:${SKILL_CENTER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - skillcenter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [skillcenter]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${SKILL_CENTER_REDIS_PORT:-6379}:6379"
    volumes:
      - skillcenter-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [skillcenter]

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${SKILL_CENTER_OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - skillcenter-opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks: [skillcenter]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SKILL_CENTER_MINIO_ROOT_USER:-skillcenter}
      MINIO_ROOT_PASSWORD: ${SKILL_CENTER_MINIO_ROOT_PASSWORD:-local-dev-only-change-me}
    ports:
      - "127.0.0.1:${SKILL_CENTER_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${SKILL_CENTER_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - skillcenter-minio:/data
    networks: [skillcenter]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${SKILL_CENTER_MINIO_ROOT_USER:-skillcenter}
      MINIO_ROOT_PASSWORD: ${SKILL_CENTER_MINIO_ROOT_PASSWORD:-local-dev-only-change-me}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb --ignore-existing local/skill-packages
    networks: [skillcenter]

volumes:
  skillcenter-postgres:
  skillcenter-redis:
  skillcenter-opensearch:
  skillcenter-minio:

networks:
  skillcenter:
