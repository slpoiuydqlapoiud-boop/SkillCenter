apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillcenter.fullname" . }}-api
  labels:
    {{- include "skillcenter.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "skillcenter.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.servicePort }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillcenter.fullname" . }}-web
  labels:
    {{- include "skillcenter.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "skillcenter.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.servicePort }}
      targetPort: http
      protocol: TCP
