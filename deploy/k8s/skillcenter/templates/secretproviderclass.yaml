{{- if .Values.csms.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "skillcenter.fullname" . }}-csms
  labels:
    {{- include "skillcenter.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.csms.provider | quote }}
  parameters:
    useWorkloadCred: {{ .Values.csms.useWorkloadCred | quote }}
    objects: |
      {{- range .Values.csms.objects }}
      - objectName: {{ .csmsName | quote }}
        objectAlias: {{ .alias | quote }}
        objectVersion: {{ default "latest" .version | quote }}
        objectType: "csms"
      {{- end }}
  secretObjects:
    - secretName: {{ .Values.csms.secretName }}
      type: Opaque
      labels:
        {{- include "skillcenter.selectorLabels" . | nindent 8 }}
      data:
        {{- range .Values.csms.objects }}
        - objectName: {{ .alias | quote }}
          key: {{ .key | quote }}
        {{- end }}
{{- end }}
