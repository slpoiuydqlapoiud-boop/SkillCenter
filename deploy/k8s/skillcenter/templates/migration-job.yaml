{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "skillcenter.fullname" . }}-migration
  labels:
    {{- include "skillcenter.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "skillcenter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "skillcenter.serviceAccountName" . }}
      containers:
        - name: migration
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["java"]
          args:
            - "-jar"
            - "/app/app.jar"
            - "--spring.main.web-application-type=none"
            - "--skill-center.migration-only=true"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          envFrom:
            - configMapRef:
                name: {{ include "skillcenter.fullname" . }}-config
            {{- if .Values.api.secretRef.enabled }}
            - secretRef:
                name: {{ .Values.csms.secretName }}
                optional: false
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          {{- if $.Values.csms.enabled }}
          volumeMounts:
            - name: csms-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
          {{- end }}
      {{- if .Values.csms.enabled }}
      volumes:
        - name: csms-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "skillcenter.fullname" . }}-csms
      {{- end }}
{{- end }}
